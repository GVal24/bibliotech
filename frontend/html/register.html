<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliotech - Registro</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css?v=a11y2">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <script src="../js/utils/themeSwitcher.js?v=a11y2"></script>
    <script src="../js/utils/fontSizeControl.js?v=a11y2"></script>
</head>
<body class="w3-display-container" style="height:100vh;">
    <div class="w3-display-topright w3-padding" data-theme-toggle></div>
    <div class="w3-display-topleft w3-padding" data-fontsize-toggle></div>
    <div class="w3-display-middle w3-mobile" style="width:400px;">
        <div class="w3-card-4 vault-card w3-padding-large w3-round-large">
            <img src="../img/logo.png" alt="Bibliotech" class="bt-logo-lg">
            <h2 class="w3-center w3-text-yellow"><b>CREAR CUENTA</b></h2>
            <form id="registerForm">
                <label>Nombre de Usuario</label>
                <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="text" id="username" minlength="3" maxlength="50" required>
                <br>
                <label>Contraseña</label>
                <input class="w3-input w3-border w3-round w3-transparent w3-text-white" type="password" id="password" minlength="8" required>
                <p class="w3-small">Mínimo 8 caracteres, con al menos una letra y un número.</p>
                <br>
                <button type="submit" class="w3-button w3-yellow w3-block w3-round-large"><b>REGISTRARSE</b></button>
            </form>
            <p class="w3-small w3-center">¿Ya tienes cuenta? <a href="/login" class="w3-text-yellow">Inicia Sesión</a></p>
        </div>
    </div>

    <script src="../js/services/apiService.js"></script>
    <script src="../js/components/uiHandlers.js"></script>
    <script src="../js/utils/authHelper.js"></script>
    <script src="../js/frontControllers/authFrontController.js"></script>
</body>
</html>
