<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotech - Registro</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css?v=a11y2">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <script src="../js/utils/themeSwitcher.js?v=a11y2"></script>
    <script src="../js/utils/fontSizeControl.js?v=a11y2"></script>
</head>
<body class="bt-landing bt-page">

<div class="w3-bar bt-nav">
    <span class="w3-bar-item bt-brand">
        <img src="../img/logo.png" alt="Bibliotech" class="bt-logo"><b>BIBLIOTECH</b>
    </span>
    <span class="w3-bar-item bt-subtitle">Biblioteca digital</span>
    <span class="w3-bar-item w3-right" data-theme-toggle></span>
    <span class="w3-bar-item w3-right" data-fontsize-toggle></span>
    <span class="w3-bar-item w3-right">
        <a class="w3-button w3-round bt-btn-ghost" href="/login">Iniciar sesión</a>
    </span>
</div>

<div class="bt-bg-orbs" aria-hidden="true">
    <span class="bt-orb bt-orb-1"></span>
    <span class="bt-orb bt-orb-2"></span>
</div>

<div class="bt-main">
    <div class="bt-auth-wrap">
        <div class="bt-auth-card">
            <img src="../img/logo.png" alt="Bibliotech" class="bt-logo-lg">
            <h2 class="w3-center w3-text-yellow"><b>CREAR CUENTA</b></h2>
            <form id="registerForm">
                <label>Nombre de Usuario</label>
                <input class="w3-input w3-border w3-round w3-transparent" type="text" id="username" minlength="3" maxlength="50" required>
                <p class="w3-small">Entre 3 y 50 caracteres. Puede incluir letras, números y espacios.</p>
                <br>
                <label>Contraseña</label>
                <input class="w3-input w3-border w3-round w3-transparent" type="password" id="password" minlength="8" required>
                <p class="w3-small">Mínimo 8 caracteres, con al menos una letra y un número.</p>
                <br>
                <button type="submit" class="w3-button w3-yellow w3-block w3-round-large bt-btn-glow"><b>REGISTRARSE</b></button>
            </form>
            <p class="w3-small w3-center">¿Ya tienes cuenta? <a href="/login" class="w3-text-yellow">Inicia Sesión</a></p>
        </div>
    </div>
</div>

<footer class="w3-container w3-center w3-padding-24 bt-footer">
    <p class="bt-copyright">&copy; <span id="btYear"></span> Guillermina Valdez. Todos los derechos reservados.</p>
</footer>

<script src="../js/services/apiService.js"></script>
<script src="../js/components/uiHandlers.js"></script>
<script src="../js/utils/authHelper.js"></script>
<script src="../js/frontControllers/authFrontController.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var y = document.getElementById('btYear');
        if (y) y.textContent = String(new Date().getFullYear());
    });
</script>
</body>
</html>
